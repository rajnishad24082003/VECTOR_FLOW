# Production overrides for a single VM, with Caddy terminating HTTPS in front of the API.
# docker compose -f docker-compose.yml -f deploy/oracle/docker-compose.prod.yml up -d --build
services:
  elasticsearch:
    restart: unless-stopped
    environment:
      # Undo the dev-only override from docker-compose.yml.
      - cluster.routing.allocation.disk.threshold_enabled=true

  redis:
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
